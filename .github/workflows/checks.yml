name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Browser change detection
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.changes.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: changes
        run: node .github/scripts/browser-ci.mjs changes
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:ci
      - run: pnpm build
  e2e:
    name: Browser E2E (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: browsers
        run: pnpm --filter @my-beads/web exec playwright install --with-deps --only-shell chromium webkit
      - name: Chromium shard
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/e2e/chromium
        run: pnpm test:e2e --project=chromium --shard=${{ matrix.shard }}/2 --output=test-results/e2e/chromium
      - name: WebKit shard
        # Preserve both browser results even when Chromium tests fail.
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/e2e/webkit
        run: pnpm test:e2e --project=webkit --shard=${{ matrix.shard }}/2 --output=test-results/e2e/webkit
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-e2e-${{ matrix.shard }}
          path: |
            apps/web/test-results/e2e/
            apps/web/playwright-report/e2e/
          if-no-files-found: ignore
          retention-days: 7
  production:
    name: Browser production smoke
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @my-beads/web exec playwright install --with-deps --only-shell chromium webkit
      - run: pnpm test:production
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-production
          path: |
            apps/web/test-results/production/
            apps/web/playwright-report/production/
          if-no-files-found: ignore
          retention-days: 7
  browser:
    name: Browser workflows
    needs: [changes, e2e, production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check browser results
        env:
          BROWSER_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/browser-ci.mjs gate
